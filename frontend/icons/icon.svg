<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>

    <!-- Cyan Neon Glow -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Car Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Radar Pulse Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" filter="url(#glow)" />

  <!-- Satellite Signal Arcs on Top -->
  <path d="M 216 110 A 50 50 0 0 1 296 110" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 196 90 A 75 75 0 0 1 316 90" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Headlight Light Beams -->
  <polygon points="210,210 150,110 362,110 302,210" fill="url(#neonCyan)" opacity="0.25" filter="url(#glow)" />

  <!-- Realistic Car Silhouette (Top-Down) -->
  <g transform="translate(256, 266) scale(2.2) translate(-30, -55)">
    <!-- Wheels -->
    <rect x="2" y="20" width="6" height="15" rx="3" fill="#000" />
    <rect x="52" y="20" width="6" height="15" rx="3" fill="#000" />
    <rect x="2" y="74" width="6" height="16" rx="3" fill="#000" />
    <rect x="52" y="74" width="6" height="16" rx="3" fill="#000" />
    
    <!-- Mirrors -->
    <path d="M 4 35 Q 0 35 1 30 Q 5 30 6 35 Z" fill="#0284c7" />
    <path d="M 56 35 Q 60 35 59 30 Q 55 30 54 35 Z" fill="#0284c7" />
    
    <!-- Body -->
    <path d="M 12 14 Q 30 6 48 14 Q 54 24 53 46 Q 55 76 52 98 Q 48 106 30 106 Q 12 106 8 98 Q 5 76 7 46 Q 6 24 12 14 Z" 
          fill="url(#carBody)" stroke="#0369a1" stroke-width="1.2" />
          
    <!-- Windshield -->
    <path d="M 14 30 Q 30 26 46 30 L 43 45 Q 30 42 17 45 Z" fill="#0b0f19" stroke="#38bdf8" stroke-width="0.8" />
    
    <!-- Sunroof -->
    <rect x="18" y="47" width="24" height="24" rx="2" fill="#070a12" />
    
    <!-- Rear Glass -->
    <path d="M 17 73 Q 30 71 43 73 L 45 84 Q 30 86 15 84 Z" fill="#0b0f19" stroke="#38bdf8" stroke-width="0.8" />
    
    <!-- Headlights -->
    <polygon points="10,14 18,11 16,17 10,18" fill="#ffffff" filter="url(#glow)" />
    <polygon points="50,14 42,11 44,17 50,18" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Tail Brake Lights -->
    <polygon points="9,99 18,102 17,105 9,103" fill="#ef4444" />
    <polygon points="51,99 42,102 43,105 51,103" fill="#ef4444" />
  </g>
</svg>
